services:
  agente-comercial:
    build: .
    container_name: agente-comercial
    restart: unless-stopped
    ports:
      - "43872:3000"
    environment:
      NODE_ENV: "production"
      DATABASE_URL: "file:/app/data/dev.db"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    volumes:
      - /mnt/user/appdata/agente-comercial/data:/app/data